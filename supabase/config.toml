# Minimal Supabase CLI config for local development (`supabase start`).
# Run `supabase init` to regenerate the full default file if you need more options.
project_id = "reelwise"

[api]
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 17

[auth]
site_url = "reelwise://"
# Email confirmation off locally so sign-up lands straight in onboarding.
[auth.email]
enable_confirmations = false

[functions.analyze-business]
verify_jwt = true
