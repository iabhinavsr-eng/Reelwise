kind = "design-system"
previewPath = "/reelwise/"
title = "Reelwise Design System"
description = "A reusable visual system for Reelwise, a mobile teleprompter and video-recording app that helps creators read scripts naturally and prepare social videos."
version = "1.0.0"
id = "artifacts/reelwise"
router = "path"

[[services]]
name = "web"
paths = [ "/reelwise/" ]
