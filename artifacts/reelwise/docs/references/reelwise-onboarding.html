<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reelwise iOS Onboarding</title>
<style>
:root{--ink:#171b19;--muted:#747a77;--accent:#2f7d62;--soft:#eaf4ef;--line:#e5e8e6;--bg:#eef0ed}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.phone{width:390px;height:844px;background:#fff;border-radius:48px;box-shadow:0 30px 80px #0002;border:8px solid #111;overflow:hidden;position:relative}
.status{height:46px;padding:14px 24px 0;display:flex;justify-content:space-between;font-size:13px;font-weight:650}.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:116px;height:31px;background:#111;border-radius:20px}
.app{height:calc(100% - 46px);display:flex;flex-direction:column}.nav{height:55px;display:flex;align-items:center;padding:0 19px;border-bottom:1px solid #f2f2f2}.back{width:36px;font-size:28px;cursor:pointer}.logo{font-weight:800;margin:auto;font-size:17px}.logo span{color:var(--accent)}.ghost{width:36px}
.progress{height:4px;background:#edf0ee}.bar{height:100%;background:var(--accent);transition:.3s}
.content{padding:27px 22px 120px;overflow:auto;flex:1}.step{font-size:12px;font-weight:750;color:var(--accent);letter-spacing:.04em;margin-bottom:11px}h1{font-size:30px;line-height:1.08;letter-spacing:-1px;margin:0 0 11px}p{font-size:15px;line-height:1.45;color:var(--muted);margin:0 0 25px}
label{font-size:13px;font-weight:700;display:block;margin:0 0 7px}.field{margin-bottom:17px}input,textarea{width:100%;border:1px solid #d9ddda;border-radius:13px;padding:14px;font:inherit;font-size:16px;outline:none;background:#fafbfa}textarea{min-height:132px;resize:none}input:focus,textarea:focus{border-color:var(--accent)}
.bottom{position:absolute;left:0;right:0;bottom:0;padding:14px 20px 25px;background:linear-gradient(#fff0,#fff 20%);padding-top:28px}.primary{width:100%;border:0;border-radius:15px;padding:16px;background:var(--ink);color:white;font-size:16px;font-weight:750;cursor:pointer}.primary:active{transform:scale(.99)}
.note{padding:13px 14px;background:var(--soft);border-radius:13px;color:#3c6555;font-size:13px;line-height:1.4;margin-bottom:18px}.chips{display:flex;flex-wrap:wrap;gap:9px}.chip{padding:11px 13px;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:14px;cursor:pointer}.chip.on{background:var(--soft);border-color:#a8cdbd;color:#22694f;font-weight:650}
.scan{text-align:center;padding-top:110px}.spinner{width:48px;height:48px;border:4px solid #dce8e2;border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;margin:0 auto 24px}@keyframes s{to{transform:rotate(360deg)}}.checks{text-align:left;margin:30px auto;max-width:270px}.checks div{padding:8px 0;font-size:14px;color:#5f6864}.checks b{color:var(--accent)}
.summary{display:grid;gap:10px}.sum{border:1px solid var(--line);border-radius:14px;padding:14px}.sum small{font-size:10px;color:var(--muted);font-weight:750;letter-spacing:.05em}.sum div{font-size:14px;font-weight:600;line-height:1.35;margin-top:5px}.done{text-align:center;padding-top:38px}.checkmark{width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:27px;margin:0 auto 18px}.cards{display:grid;gap:10px;text-align:left;margin-top:23px}.card{border:1px solid var(--line);border-radius:15px;padding:15px}.card small{color:var(--accent);font-weight:750;font-size:10px}.card h3{font-size:15px;margin:6px 0}.card p{font-size:12px;margin:0}
@media(max-width:440px){body{background:white}.wrap{padding:0}.phone{width:100vw;height:100dvh;border:0;border-radius:0;box-shadow:none}.island{display:none}}
</style></head>
<body><div class="wrap"><div class="phone"><div class="island"></div><div class="status"><span>9:41</span><span>●●●  Wi‑Fi  ▰</span></div><div class="app"><div class="nav"><div class="back" id="back" onclick="prev()">‹</div><div class="logo">reel<span>wise</span></div><div class="ghost"></div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="content" id="c"></div><div class="bottom" id="bottom"></div></div></div></div>
<script>
let i=0,d={name:"",email:"",url:"",business:"Lyte Guards Inside Out Wellness",industry:"Wellness & IV Therapy",location:"Wilmington, Delaware",icp:"Busy professionals and adults 35–60 who invest in preventative wellness, want more energy and less stress, and value convenient, personalized care.",uvp:"Personalized inside-out wellness combining IV therapy with health coaching, meditation and movement to support physical and mental wellbeing.",goals:["Educate customers","Build trust"],voice:["Conversational","Warm & encouraging"]};
const C=document.getElementById("c"),B=document.getElementById("bottom"),bar=document.getElementById("bar"),back=document.getElementById("back");
function save(){["name","email","url","business","industry","location","icp","uvp"].forEach(k=>{let e=document.getElementById(k);if(e)d[k]=e.value})}
function next(){save();if(i===1){scan();return}i++;render()}function prev(){if(i<=0)return;save();i--;render()}
function tog(k,v,e){d[k]=d[k].includes(v)?d[k].filter(x=>x!==v):[...d[k],v];e.classList.toggle("on")}
function btn(t="Continue"){B.innerHTML=`<button class="primary" onclick="next()">${t}</button>`}
function render(){back.style.visibility=i===0||i===8?"hidden":"visible";bar.style.width=`${Math.min(i,7)/7*100}%`;let h="";
if(i===0){h=`<div class="step">WELCOME</div><h1>Let’s build content that actually sounds like you.</h1><p>We’ll learn your business, audience and voice so your reel ideas are useful from day one.</p><div class="field"><label>Your name</label><input id="name" value="${d.name}" placeholder="Alex Morgan"></div><div class="field"><label>Work email</label><input id="email" value="${d.email}" placeholder="alex@business.com"></div><div class="field"><label>Password</label><input type="password" value="prototype123"></div>`;btn("Create account")}
if(i===1){h=`<div class="step">YOUR BUSINESS</div><h1>What’s your website?</h1><p>That’s all we need to get started. We’ll read it and prepare your business profile for you.</p><div class="field"><label>Business URL</label><input id="url" value="${d.url}" placeholder="https://yourbusiness.com" inputmode="url"></div><div class="note">You’ll review everything before we use it to create content.</div>`;btn("Analyze my business")}
if(i===2){h=`<div class="step">BUSINESS PROFILE</div><h1>Did we get this right?</h1><p>Edit anything that doesn’t accurately describe the business.</p><div class="field"><label>Business name</label><input id="business" value="${d.business}"></div><div class="field"><label>Industry</label><input id="industry" value="${d.industry}"></div><div class="field"><label>Primary market</label><input id="location" value="${d.location}"></div>`;btn("Looks right")}
if(i===3){h=`<div class="step">YOUR AUDIENCE · AI SUGGESTION</div><h1>Who are you talking to?</h1><p>We drafted an ideal customer based on your business. Make it sound like the people you actually want more of.</p><div class="note">✨ Suggested ICP</div><div class="field"><textarea id="icp">${d.icp}</textarea></div>`;btn("Use this audience")}
if(i===4){h=`<div class="step">YOUR ADVANTAGE · AI SUGGESTION</div><h1>Why should they choose you?</h1><p>This helps us make your content specific instead of producing generic industry advice.</p><div class="note">✨ Suggested UVP</div><div class="field"><textarea id="uvp">${d.uvp}</textarea></div>`;btn("Use this positioning")}
if(i===5){let a=["Educate customers","Build trust","Get more leads","Grow followers","Promote services","Stay top of mind"];h=`<div class="step">CONTENT GOALS</div><h1>What should your content do?</h1><p>Choose what matters most. This changes the ideas we recommend.</p><div class="chips">${a.map(x=>`<button class="chip ${d.goals.includes(x)?"on":""}" onclick="tog('goals','${x}',this)">${x}</button>`).join("")}</div>`;btn()}
if(i===6){let a=["Conversational","Warm & encouraging","Straightforward","Professional","Playful","Bold opinions","Educational"];h=`<div class="step">YOUR VOICE</div><h1>How should you sound?</h1><p>Think about how you’d actually speak to a customer, not how a brochure would sound.</p><div class="chips">${a.map(x=>`<button class="chip ${d.voice.includes(x)?"on":""}" onclick="tog('voice','${x}',this)">${x}</button>`).join("")}</div>`;btn()}
if(i===7){h=`<div class="step">FINAL REVIEW</div><h1>Your Content Playbook</h1><p>We’ll use this profile every time we recommend a reel or write a script.</p><div class="summary"><div class="sum"><small>BUSINESS</small><div>${d.business}</div></div><div class="sum"><small>IDEAL CUSTOMER</small><div>${d.icp}</div></div><div class="sum"><small>UNIQUE VALUE</small><div>${d.uvp}</div></div><div class="sum"><small>CONTENT GOALS</small><div>${d.goals.join(" · ")}</div></div><div class="sum"><small>VOICE</small><div>${d.voice.join(" · ")}</div></div></div>`;btn("Start creating")}
if(i===8){h=`<div class="done"><div class="checkmark">✓</div><div class="step">YOU’RE READY</div><h1>What should we talk about today?</h1><p>Your first recommendations are already waiting.</p><div class="cards"><div class="card"><small>SEASONAL ADVICE</small><h3>The fall schedule reset</h3><p>Why taking care of yourself is often the first thing to disappear when life gets busy.</p></div><div class="card"><small>FAQ</small><h3>Which IV do I actually need?</h3><p>Answer a question a prospective customer may ask before booking.</p></div><div class="card"><small>QUICK TIP</small><h3>Don’t wait to feel thirsty</h3><p>A useful hydration thought that doesn’t start as a sales pitch.</p></div></div></div>`;B.innerHTML=`<button class="primary" onclick="i=0;render()">Restart prototype</button>`}
C.innerHTML=h;C.scrollTop=0}
function scan(){back.style.visibility="hidden";bar.style.width="25%";B.innerHTML="";C.innerHTML=`<div class="scan"><div class="spinner"></div><h1>Learning your business…</h1><p>Give us a moment. We’re preparing your starting profile.</p><div class="checks"><div><b>✓</b> Reading services</div><div><b>✓</b> Understanding positioning</div><div><b>✓</b> Building your audience</div><div><b>✓</b> Drafting your UVP</div></div></div>`;setTimeout(()=>{i=2;render()},1500)}
render();
</script></body></html>
